version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Types must match the oldest supported runtime in engines.node, not the newest Node.
      - dependency-name: "@types/node"
        update-types: [version-update:semver-major]
    cooldown:
      default-days: 3
    groups:
      minor-and-patch:
        update-types: [minor, patch]
