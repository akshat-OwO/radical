packages:
  - apps/*
  - packages/*
  - tools/*

catalogMode: prefer

catalog:
  "@effect/tsgo": ^0.53.4
  "@effect/vitest": ^4.0.5
  "@types/node": ^24
  effect: ^4.0.5
  oxfmt: ^0.71.0
  oxlint: ^1.88.0
  oxlint-tsgolint: ^7.0.2004
  typescript: ^7.0.2
  ultracite: 8.0.1
  vite: npm:@voidzero-dev/vite-plus-core@1.3.0
  vite-plus: 1.3.0
  vitest: 5.0.5
overrides:
  vite@*: "catalog:"
  vitest@*: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
