packages:
  - apps/*
  - packages/*
  - tools/*

catalogMode: prefer

catalog:
  blume: 2.2.6
  unified: ^11.0.5
  remark-gfm: ^4.0.1
  remark-parse: ^11.0.0
  remark-mdx: ^3.1.1
  "@tailwindcss/vite": ^4.3.1
  tailwindcss: ^4.3.1
  "@tanstack/react-start": 1.169.4
  react: 19.3.1
  react-dom: 19.3.1
  "@types/react": ^19.2.0
  "@types/react-dom": ^19.2.0
  "@vitejs/plugin-react": ^6.0.0
  "@capawesome/capacitor-google-sign-in": 0.1.4

  "@capacitor/local-notifications": 8.3.1
  "@capacitor-firebase/messaging": 8.5.2
  "@capawesome/capacitor-badge": 8.0.4
  "@capgo/camera-preview": 8.14.2
  "@capacitor-community/file-opener": 8.0.1
  "@capacitor/android": ^8.5.3
  "@capacitor/app-launcher": 8.0.1
  "@capacitor/cli": ^8.5.3
  "@capacitor/camera": 8.2.6
  "@capacitor/geolocation": 8.2.4
  "@capacitor/core": ^8.5.3
  "@capacitor/device": ^8.0.3
  "@capacitor/haptics": 8.0.2
  "@capacitor/network": 8.0.1
  "@capacitor/ios": ^8.5.3
  "@capacitor/splash-screen": ^8.0.2
  "@capawesome/capacitor-file-picker": 8.1.1
  "@effect/platform-node": ^4.0.5
  "@effect/tsgo": ^0.53.4
  "@effect/vitest": ^4.0.5
  "@tanstack/react-router": 1.170.46
  "@types/node": ^24
  "@types/semver": ^7.8.0
  effect: ^4.0.5
  oxfmt: ^0.71.0
  oxlint: ^1.88.0
  oxlint-tsgolint: ^7.0.2004
  semver: ^7.8.5
  sharp: ^0.35.5
  typescript: ^7.0.2
  ultracite: 8.0.1
  vite: npm:@voidzero-dev/vite-plus-core@1.3.0
  vite-plus: 1.3.0
  vitest: 5.0.5
  "@babel/parser": 7.29.9
  "@babel/types": 7.29.8
  ignore: ^7.0.13
  yaml: ^2.9.1
  svg2vectordrawable: 2.9.1
overrides:
  happy-dom: ">=21.0.4"
  "seroval@>=1.5.5 <1.6.11": ^1.6.11
  "path-to-regexp@>=4 <6.3.0": ^6.3.0
  "zod@>=4 <4.6.6": ^4.6.6
  "postcss-selector-parser@<6.1.5": ^6.1.5
  "xcode>uuid@<11.1.1": ^11.1.1
  vite@*: "catalog:"
  vitest@*: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"

allowBuilds:
  esbuild: true
  sharp: true
minimumReleaseAgeExclude:
  - "@capgo/camera-preview@8.14.2"
  - blume@2.2.6

# Wait three days before accepting new dependency releases.
minimumReleaseAge: 4320
# Reject releases that reduce the package publication trust level.
trustPolicy: no-downgrade
# Reject exotic sources in transitive dependencies.
blockExoticSubdeps: true
# Fail installs when a dependency build has not been reviewed.
strictDepBuilds: true

auditConfig:
  ignoreGhsas:
    # Ultracite pulls deepmerge, which has no patched release.
    - GHSA-gcqx-w48m-w2h4

trustPolicyExclude:
  # Vercel retains OIDC publishing but stopped attaching provenance after 3.7.6.
  - "@vercel/functions@3.10.3"
  # Routing utils also retains OIDC publishing without provenance.
  - "@vercel/routing-utils@6.6.0"
  # Blume pins Pierre theme 2.0.0, whose publisher omitted provenance.
  - "@pierre/theme@2.0.0"
  # Node 22 type declarations require this pre-provenance Undici type release.
  - undici-types@6.21.0
  # Vercel OIDC also retains OIDC publishing without provenance.
  - "@vercel/oidc@4.0.3"
  # Vercel CLI config also retains OIDC publishing without provenance.
  - "@vercel/cli-config@0.3.3"
  # Vercel CLI exec also retains OIDC publishing without provenance.
  - "@vercel/cli-exec@1.0.1"
  # Babel requires the Semver 6 release line, published before provenance.
  - semver@6.3.1
  # The pinned Capacitor haptics release lacks a provenance attestation.
  - "@capacitor/haptics@8.0.2"
